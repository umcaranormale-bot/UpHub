spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.flyway.out-of-order=true

server.port=${PORT:8080}
uphub.cors.origens=${CORS_ORIGENS:http://localhost:5173}

uphub.gmail.client-id=${GMAIL_CLIENT_ID:}
uphub.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
uphub.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
uphub.mail.remetente=${MAIL_REMETENTE:naoresponda.uphub@gmail.com}