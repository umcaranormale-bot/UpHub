# CI do Up Hub: a cada push na main e a cada pull request, compila e testa o back-end e o front-end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end (build e testes)
    runs-on: ubuntu-latest
    services:
      # banco descartável, só para os testes: sobe vazio e some no fim (não é o banco do projeto)
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uphub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Chave do token só para os testes
        run: |
          CHAVE=$(openssl rand -base64 48)
          echo "::add-mask::$CHAVE"
          echo "JWT_SECRET=$CHAVE" >> "$GITHUB_ENV"
      - name: Compila, roda as migrations num banco vazio e roda os testes
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/uphub_ci
          DB_USER: postgres
          DB_PASSWORD: postgres

  frontend:
    name: Front-end (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # enquanto o front corrige os 2 avisos do StatusFilters.tsx, o lint aparece no relatório sem travar o CI
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
